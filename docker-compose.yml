services:
  postgres:
    image: postgres:16-alpine
    container_name: local-business-scrapper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: menaia
      POSTGRES_PASSWORD: menaia
      POSTGRES_DB: local_business_scrapper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menaia -d local_business_scrapper"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
